[package]
name = "minst"
version = "0.1.0"
edition = "2024"

[dependencies]
async-compat = "0.2.5"
clap = { version = "4.5.48", features = ["derive"] }
dirs-next = "2.0.0"
futures-util = "0.3.31"
indicatif = "0.18.0"
reqwest = { version = "0.12.23", features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smol = "2.0.2"
zip = "5.1.1"

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.10" }
